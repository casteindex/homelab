services:
  caddy:
    image: ghcr.io/caddybuilds/caddy-cloudflare:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - "${DATA_DIR}/caddy:/data"
      - "${CONFIG_DIR}/caddy:/config"
    environment:
      CF_API_TOKEN: "${CF_API_TOKEN}"
      ROOT_DOMAIN: "${ROOT_DOMAIN}"
    networks:
      - proxy

networks:
  proxy:
    external: true
